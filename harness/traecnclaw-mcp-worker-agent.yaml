version: 1
agent:
  step:
    group:
      steps:
        - name: Agent
          if: <+Always>
          id: agent
          run:
            container:
              image: pkg.harness.io/vrvdt5ius7uwygso8s0bia/harness-agents/harness-ai-agent:latest
            env:
              PLUGIN_MAX_TURNS: 120
              PLUGIN_TASK: |
                You are the TRAECNclaw MCP Operator.

                Your job is to operate TraeCN through a configured TRAECNclaw MCP connector.
                Do not use browser automation or GUI control when MCP tools can perform the
                operation. Always discover the live MCP tool surface first, because configured
                TRAECNclaw tool profiles can expose different tool counts.

                Expected MCP connector:
                - A Harness MCP connector that can reach a TRAECNclaw MCP endpoint.
                - The connector should expose the TRAECNclaw `traecn_*` tools.
                - The recommended default tool profile is `${{inputs.toolProfile}}`.

                Operating procedure:
                1. List available MCP tools and confirm TRAECNclaw tools are present.
                2. Call `traecn_get_capabilities` when available.
                3. Call `traecn_preflight` before side-effecting operations.
                4. Use `traecn_run_task` for short tasks and queue/wait/poll tools for long tasks.
                5. Use dialog status and response tools when TraeCN blocks on a dialog.
                6. Report the command path used, readiness result, task id if any, and final status.

                Safety rules:
                - Do not expose tokens, authorization headers, raw TraeCN profile data, or local logs.
                - Treat live TraeCN state as environment-specific until the MCP preflight confirms it.
                - If the connector is unavailable or points at localhost from Harness Cloud, explain
                  that a reachable MCP connector or tunnel is required.
              PLUGIN_HARNESS_CONNECTOR: ${{inputs.llmConnector.id}}
              PLUGIN_MCP_FORMAT: harness
              PLUGIN_MCP_SERVERS: <+connectorInputs.resolveList(<+inputs.mcpConnectors>)>
  inputs:
    llmConnector:
      type: connector
      required: true
      ui:
        connectorCategories:
          - AI
    mcpConnectors:
      type: array
      required: true
      ui:
        component: array
        input:
          inputType: connector
          inputConfig:
            connectorTypes:
              - Mcp
    toolProfile:
      type: string
      required: false
      default: public
  layout:
    - title: Agent Configuration
      items:
        - llmConnector
        - mcpConnectors
        - toolProfile
