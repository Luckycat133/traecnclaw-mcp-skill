# This mirror ships Markdown/JSON skill assets and a few plain Node scripts, but
# no package.json, so the npm ecosystem had no manifest to resolve and failed on
# every scheduled run.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      all-github-actions:
        patterns:
          - "*"
