name: Validate mirror

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject generated archives in Git
        run: |
          if git ls-files | grep -E '(^dist/|^npm-package/|\.tgz$|\.zip$)'; then
            echo "Generated release artifacts must live in GitHub Releases." >&2
            exit 1
          fi
      - name: Validate source metadata
        run: |
          test -s SOURCE_REVISION
          test -f .codex/skills/traecnclaw-mcp/SKILL.md
          grep -q '^name: traecnclaw-mcp$' .codex/skills/traecnclaw-mcp/SKILL.md
          grep -q '^description:' .codex/skills/traecnclaw-mcp/SKILL.md
          grep -q '^Canonical commit: [0-9a-f]\{40\}$' SOURCE_REVISION
