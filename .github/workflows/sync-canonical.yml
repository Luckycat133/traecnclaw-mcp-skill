name: Legacy canonical sync (disabled)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Legacy input retained for callers; all legacy syncs are rejected
        required: false
  repository_dispatch:
    types: [sync-traecnclaw-skill]

# No checkout, private-source access, publishing permissions or credentials.
# Keep the old entry points so callers receive a visible, fail-closed result.
permissions: {}

jobs:
  reject-legacy-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Reject legacy private-source synchronization
        run: |
          echo '::error::Legacy canonical sync is disabled before any source checkout or public push.'
          echo 'Use a separately reviewed, pinned public release export with pre-publication allowlist and provenance checks.'
          exit 1
